kind = "mobile"
previewPath = "/"
title = "2gether"
description = "A private mobile space for partners to share moods, messages, photos, worries, and plans together. Includes a reliable shared calendar with event creation, date selection, refresh, and deletion."
version = "1.0.0"
id = "artifacts/we2gether"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21109

[services.development]
run = "pnpm --filter @workspace/we2gether run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/we2gether", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/we2gether", "run", "serve" ]

[services.env]
PORT = "21109"
BASE_PATH = "/"
